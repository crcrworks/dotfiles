onboarding = false

[theme]
name = "tokyo-night"

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "agent", "state_text"],
  ["workspace", "tab"],
]

[ui.toast]
delivery = "herdr"        # バックグラウンドのエージェントが終わったら通知
delay_seconds = 1

[experimental]
switch_ascii_input_source_in_prefix = true
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["opencode", "claude", "codex"]

[worktrees]
directory = "~/herdr-worktrees"

# lazygit をポップアップで開く: prefix+alt+g
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"
